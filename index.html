<!DOCTYPE html>
<html lang="th">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>My Playlist Player</title>
    <link rel="stylesheet" href="style.css">
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css" rel="stylesheet">
</head>
<body>
    <div class="player-container">
        <!-- ส่วนหัวและปุ่มควบคุม -->
        <div class="header">
            <h2 id="song-title"><i class="fas fa-music"></i> เลือกเพลงเพื่อเล่น</h2>
            <div class="controls-main">
                <button id="prev-btn" class="icon-btn"><i class="fas fa-backward"></i></button>
                <button id="play-pause-btn" class="play-btn"><i class="fas fa-play"></i></button>
                <button id="stop-btn" class="icon-btn" title="หยุดเล่น"><i class="fas fa-stop"></i></button>
                <button id="next-btn" class="icon-btn"><i class="fas fa-forward"></i></button>
            </div>
        </div>

        <!-- แถบเวลา (Progress Bar) -->
        <div class="progress-area">
            <span id="current-time">00:00</span>
            <div class="progress-bar-container" id="progress-container">
                <div class="progress-bar" id="progress"></div>
            </div>
            <span id="total-time">00:00</span>
        </div>

        <!-- รายการเพลง (Playlist) -->
        <div class="playlist">
            <h3><i class="fas fa-list"></i> เพลย์ลิสต์ของฉัน (20 เพลง)</h3>
            <ul id="playlist-list">
                <!-- รายชื่อเพลงจะถูกสร้างด้วย JavaScript -->
            </ul>
        </div>
        
        <audio id="audio-player"></audio>
    </div>

    <script src="script.js"></script>
</body>
</html>
